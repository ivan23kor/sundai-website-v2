name: Test Suite with Database

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-with-db:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI: true
      GOOGLE_PRIVATE_KEY: eyJjbGllbnRfZW1haWwiOiJ0ZXN0QGV4YW1wbGUuY29tIn0=
      GOOGLE_CLOUD_BUCKET: dummy-bucket
      WEBHOOK_SECRET: dummy
      REPLICATE_API_TOKEN: dummy
      GEMINI_API_KEY: dummy
      NEXT_PUBLIC_POSTHOG_KEY: dummy
      NEXT_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      SITE_URL: https://example.com

    services:
      postgres:
        image: postgres:15@sha256:baa22e6286bf832cb147b8bb5aa9d8bc999846d69c21d11bf63f58fbeed1fa48
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sundai_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false

    - name: Use Node.js 22.23.4
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: '22.23.4'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Set up environment variables
      run: |
        printf '%s\n' \
          'DATABASE_URL=postgresql://postgres:postgres@localhost:5432/sundai_test' \
          'NEXTAUTH_SECRET=test-secret' \
          'NEXTAUTH_URL=http://localhost:3000' >> .env.test

    - name: Generate Prisma client
      run: npx prisma generate

    - name: Run database migrations
      run: npx prisma migrate deploy
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sundai_test

    - name: Run linter
      run: npm run lint

    - name: Run type checking
      run: npx tsc --noEmit

    - name: Run tests
      run: npm run test:ci
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sundai_test

    - name: Build application
      run: npm run build

    - name: Upload coverage reports
      uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
